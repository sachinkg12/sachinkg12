    <linearGradient id="s" x1="0" y1="0" x2="620" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1a2e"/><stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="618" height="198" rx="16" fill="url(#s)" stroke="#1d3a5f"/>
  <rect x="1" y="1" width="6" height="198" rx="3" fill="#b894ff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
