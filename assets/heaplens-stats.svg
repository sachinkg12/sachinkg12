<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HeapLens adoption: 589 developers across 57 countries and 363 cities, 1,733 heap analyses completed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08121f"/><stop offset="1" stop-color="#0a1a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6ff"/><stop offset="0.5" stop-color="#82f1c3"/><stop offset="1" stop-color="#b894ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="198" rx="20" fill="url(#bg)" stroke="#1d3a5f"/>

  <circle cx="64" cy="42" r="5" fill="#4ade80">
    <animate attributeName="fill-opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="47" font-family="'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#c7d6ea">HEAPLENS IN THE WILD</text>
  <text x="1160" y="47" text-anchor="end" font-family="'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace" font-size="12" fill="#55719a">anonymous usage telemetry · Jul 2026</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <g>
      <rect x="64" y="78" width="250" height="98" rx="14" fill="#0c1a2e" stroke="#25456d"/>
      <rect x="64" y="78" width="250" height="4" rx="2" fill="#63e6ff"/>
      <text x="189" y="132" text-anchor="middle" font-size="34" font-weight="700" fill="#63e6ff">589</text>
      <text x="189" y="160" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace" font-size="12" fill="#8ba3c2">developers reached</text>
    </g>
    <g>
      <rect x="338" y="78" width="250" height="98" rx="14" fill="#0c1a2e" stroke="#25456d"/>
      <rect x="338" y="78" width="250" height="4" rx="2" fill="#82f1c3"/>
      <text x="463" y="132" text-anchor="middle" font-size="34" font-weight="700" fill="#82f1c3">57</text>
      <text x="463" y="160" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace" font-size="12" fill="#8ba3c2">countries</text>
    </g>
    <g>
      <rect x="612" y="78" width="250" height="98" rx="14" fill="#0c1a2e" stroke="#25456d"/>
      <rect x="612" y="78" width="250" height="4" rx="2" fill="#b894ff"/>
      <text x="737" y="132" text-anchor="middle" font-size="34" font-weight="700" fill="#b894ff">363</text>
      <text x="737" y="160" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace" font-size="12" fill="#8ba3c2">cities</text>
    </g>
    <g>
      <rect x="886" y="78" width="250" height="98" rx="14" fill="#0c1a2e" stroke="#25456d"/>
      <rect x="886" y="78" width="250" height="4" rx="2" fill="#63e6ff"/>
      <text x="1011" y="132" text-anchor="middle" font-size="34" font-weight="700" fill="#63e6ff">1,733</text>
      <text x="1011" y="160" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,Consolas,Menlo,monospace" font-size="12" fill="#8ba3c2">analyses completed</text>
    </g>
  </g>
</svg>
